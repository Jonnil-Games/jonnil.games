# Netlify configuration file

[build]
  # Directory to publish
  publish = "."

[[redirects]]
  from = "*"
  to = "https://thayn.gay/soon.html"
  status = 302
  force = true

# Headers for specific paths
[[headers]]
  for = "/media/*"
  [headers.values]
    # Disable caching for development
    Cache-Control = "no-store"

[[headers]]
  for = "/css/*"
  [headers.values]
    # Disable caching for development
    Cache-Control = "no-store"

[[headers]]
  for = "/js/*"
  [headers.values]
    # Disable caching for development
    Cache-Control = "no-store"
