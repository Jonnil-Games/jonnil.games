# Netlify configuration file

[build]
  # Command to build the blog
  command = "npm run build"
  # Directory to publish (points to where the blog is generated)
  publish = "blog/public"

# Headers for specific paths
[[headers]]
  for = "/media/*"
  [headers.values]
    # Disable caching for development
    Cache-Control = "no-store"

[[headers]]
  for = "/css/*"
  [headers.values]
    # Disable caching for development
    Cache-Control = "no-store"

[[headers]]
  for = "/js/*"
  [headers.values]
    # Disable caching for development
    Cache-Control = "no-store"
