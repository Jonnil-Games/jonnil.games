# Netlify configuration file

[build]
  # Command to build the blog
  command = "npm run build"
  # Directory to publish the main root site (home, other pages)
  publish = "public"

[build.processing]
  skip_processing = false
[build.processing.css]
  bundle = true
  minify = true
[build.processing.js]
  bundle = true
  minify = true
[build.processing.images]
  compress = true

# Redirect all requests under /blog to the /public/blog directory
[[redirects]]
  from = "/blog/*"
  to = "/blog/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for specific paths
[[headers]]
  for = "/media/*"
  [headers.values]
    # Disable caching for development
    Cache-Control = "no-store"

[[headers]]
  for = "/css/*"
  [headers.values]
    # Disable caching for development
    Cache-Control = "no-store"

[[headers]]
  for = "/js/*"
  [headers.values]
    # Disable caching for development
    Cache-Control = "no-store"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self' https:; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline' https: fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' https: fonts.gstatic.com;"
    Cache-Control = "no-store"

[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "no-store"
