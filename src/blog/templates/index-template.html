<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blog - Jonnil Games</title>

    <!-- Primary Meta Tags -->
    <meta name="title" content="Blog - Jonnil Games" />
    <meta
      name="description"
      content="Latest updates, insights, and announcements from the Jonnil Games team. Read about game development, behind-the-scenes content, and more."
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://jonnil.games/blog/" />
    <meta property="og:title" content="Blog - Jonnil Games" />
    <meta
      property="og:description"
      content="Latest updates, insights, and announcements from the Jonnil Games team. Read about game development, behind-the-scenes content, and more."
    />
    <meta
      property="og:image"
      content="https://jonnil.games/images/og-preview.png"
    />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Blog - Jonnil Games" />
    <meta
      name="twitter:description"
      content="Latest updates, insights, and announcements from the Jonnil Games team. Read about game development, behind-the-scenes content, and more."
    />
    <meta
      name="twitter:image"
      content="https://jonnil.games/images/og-preview.png"
    />

    <!-- RSS, etc. -->
    <link
      rel="alternate"
      type="application/rss+xml"
      title="RSS"
      href="/blog/rss.xml"
    />
    <link
      rel="alternate"
      type="application/atom+xml"
      title="Atom"
      href="/blog/atom.xml"
    />
    <link rel="canonical" href="{{siteUrl}}{{url}}" />

    <link rel="stylesheet" href="/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/blog/styles.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css"
    />
    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      /* Enhanced animation for blog post cards to match homepage */
      .post-card {
        will-change: transform;
        transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1),
          box-shadow 0.3s ease;
      }
    </style>
  </head>
  <body>
    <!-- Header (component markup) -->
    <cyan component="header"></cyan>

    <main>
      <section class="blog-header">
        <h1>Blog</h1>
        <p>
          Latest updates, insights, and announcements from the Jonnil&nbsp;Games
          team
        </p>
      </section>

      <div class="blog-filters">
        <div class="search-container">
          <input
            type="search"
            id="blog-search"
            placeholder="Search posts..."
            aria-label="Search blog posts"
          />
        </div>

        <div class="filter-grid">
          <div class="filter-group">
            <label for="author-filter">Filter by Author</label>
            <select id="author-filter">
              <option value="">All Authors</option>
              {{#each authors}}
              <option value="{{this}}">{{this}}</option>
              {{/each}}
            </select>
          </div>

          <div class="filter-group">
            <label for="category-filter">Filter by Category</label>
            <select id="category-filter">
              <option value="">All Categories</option>
              {{#each categories}}
              <option value="{{this}}">{{this}}</option>
              {{/each}}
            </select>
          </div>
        </div>
      </div>

      <div class="post-grid">
        {{#each posts}}
        <article class="post-card">
          <div class="post-meta">
            <time datetime="{{date}}">{{formatDate date}}</time>
            <span class="post-category">{{categories.[0]}}</span>
          </div>
          <h2><a href="{{url}}" class="post-title">{{title}}</a></h2>
          <p>{{excerpt}}</p>
          <div class="post-footer">
            <span class="post-author">By {{author}}</span>
            <a href="{{url}}" class="read-more-link">Read More →</a>
          </div>
        </article>
        {{/each}}
      </div>
    </main>

    <!-- Footer (component markup) -->
    <cyan component="footer"></cyan>

    <!-- JavaScript -->
    <script src="/blog/scripts/scripts.js"></script>
  </body>
</html>
