<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{title}} - Jonnil Games</title>

    <!-- Primary Meta Tags -->
    <meta name="title" content="{{title}} - Jonnil Games" />
    <meta name="description" content="{{excerpt}}" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="article" />
    <meta property="og:url" content="https://jonnil.games{{url}}" />
    <meta property="og:title" content="{{title}} - Jonnil Games" />
    <meta property="og:description" content="{{excerpt}}" />
    <meta
      property="og:image"
      content="https://jonnil.games/images/og-preview.png"
    />
    <meta property="article:published_time" content="{{date}}T00:00:00Z" />
    <meta property="article:author" content="{{author}}" />
    {{#each categories}}
    <meta property="article:tag" content="{{this}}" />
    {{/each}}

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{title}} - Jonnil Games" />
    <meta name="twitter:description" content="{{excerpt}}" />
    <meta
      name="twitter:image"
      content="https://jonnil.games/images/og-preview.png"
    />

    <!-- RSS, etc. -->
    <link
      rel="alternate"
      type="application/rss+xml"
      title="RSS"
      href="/blog/rss.xml"
    />
    <link
      rel="alternate"
      type="application/atom+xml"
      title="Atom"
      href="/blog/atom.xml"
    />
    <link rel="canonical" href="{{siteUrl}}{{url}}" />

    <link rel="stylesheet" href="/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/blog/styles.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css"
    />
    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      /* Enhanced animation for blog post cards to match homepage */
      .post-card {
        will-change: transform;
        transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1),
          box-shadow 0.3s ease;
      }
    </style>
  </head>
  <body>
    <!-- Header (capsule markup) -->
    <drop capsule="header"></drop>

    <main>
      <section class="blog-header">
        <h1>{{title}}</h1>
        <div class="post-meta">
          <time datetime="{{date}}">{{formatDate date}}</time>
          <p class="post-author">By {{author}}</p>
          {{#if categories.length}}
          <div class="post-categories">
            {{#each categories}}
            <span class="post-category">{{this}}</span>
            {{/each}}
          </div>
          {{/if}}
        </div>
      </section>

      <article class="blog-post">
        <div class="post-content">{{{content}}}</div>

        <drop capsule="continue-discussion"></drop>
      </article>
    </main>

    <!-- Footer (capsule markup) -->
    <drop capsule="footer"></drop>

    <!-- JavaScript -->
    <script src="/blog/scripts/scripts.js"></script>
  </body>
</html>
