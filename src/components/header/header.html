<header>
  <nav class="navbar" aria-label="Primary">
    <div class="logo">
      <a href="/" aria-label="Jonnil Games Home">
        <span class="logo-text">Jonnil Games</span>
      </a>
    </div>

    <!-- Desktop Navigation Links -->
    <ul class="nav-links">
      <li><a href="/">Home</a></li>
      <li><a href="/games.html">Games</a></li>
      <li><a href="/blog/index.html">Blog</a></li>
      <li><a href="/team.html">Team</a></li>
      <li><a href="/about.html">About</a></li>
    </ul>

    <!-- Mobile Menu Toggle -->
    <button
      class="hamburger"
      type="button"
      aria-label="Toggle menu"
      aria-controls="mobile-menu"
      aria-expanded="false"
    >
      <span class="hamburger-bar" aria-hidden="true"></span>
      <span class="hamburger-bar" aria-hidden="true"></span>
      <span class="hamburger-bar" aria-hidden="true"></span>
    </button>
  </nav>

  <!-- Mobile Menu Panel -->
  <div
    id="mobile-menu"
    class="mobile-menu"
    role="dialog"
    aria-modal="true"
    aria-label="Mobile Navigation"
  >
    <!-- Explicit close button for mobile menu -->
    <button class="mobile-close" type="button" aria-label="Close menu">
      <span class="close-bar" aria-hidden="true"></span>
      <span class="close-bar" aria-hidden="true"></span>
    </button>
    <ul class="mobile-nav-links" role="menu">
      <li role="none"><a role="menuitem" href="/">Home</a></li>
      <li role="none"><a role="menuitem" href="/games.html">Games</a></li>
      <li role="none"><a role="menuitem" href="/blog/index.html">Blog</a></li>
      <li role="none"><a role="menuitem" href="/team.html">Team</a></li>
      <li role="none"><a role="menuitem" href="/about.html">About</a></li>
    </ul>

    <div class="mobile-social-links">
      <a
        class="social-icon"
        href="https://bsky.jonnil.games"
        target="_blank"
        rel="noopener"
        aria-label="BlueSky"
      >
        <i class="ri-bluesky-fill" aria-hidden="true"></i>
      </a>
      <a
        class="social-icon"
        href="https://github.com/jonnilgames"
        target="_blank"
        rel="noopener"
        aria-label="GitHub"
      >
        <i class="ri-github-fill" aria-hidden="true"></i>
      </a>
    </div>

    <div class="mobile-footer-info">
      <p>© <span id="current-year"></span> Jonnil Games</p>
      <p><a href="/about.html">About</a> · <a href="/team.html">Team</a></p>
    </div>
  </div>

  <!-- Inline script: active link highlighting, mobile menu toggle and accessibility -->
  <script>
    (function () {
      const root = document.currentScript.closest("header");
      if (!root) return;
      const currentPath = window.location.pathname;
      function shouldBeActive(linkPath) {
        if (
          linkPath === "/" &&
          (currentPath === "/" || currentPath === "/index.html")
        )
          return true;
        if (linkPath.endsWith("index.html")) {
          const base = linkPath.slice(0, -"index.html".length);
          return (
            currentPath === linkPath ||
            currentPath === base ||
            currentPath.startsWith(base)
          );
        }
        return (
          currentPath === linkPath ||
          (currentPath.endsWith(".html") &&
            currentPath.replace(".html", "") === linkPath)
        );
      }
      const desktopLinks = root.querySelectorAll(".nav-links a");
      desktopLinks.forEach((a) =>
        a.classList.toggle(
          "active",
          shouldBeActive(a.getAttribute("href") || "")
        )
      );

      const mobileLinks = root.querySelectorAll(".mobile-nav-links a");
      mobileLinks.forEach((a) =>
        a.classList.toggle(
          "active",
          shouldBeActive(a.getAttribute("href") || "")
        )
      );

      const hamburger = root.querySelector(".hamburger");
      const mobileMenu = root.querySelector("#mobile-menu");
      const body = document.body;

      // Ensure year is current in mobile footer
      const yearEl = root.querySelector("#current-year");
      if (yearEl) yearEl.textContent = String(new Date().getFullYear());

      if (hamburger && mobileMenu) {
        const closeBtn = root.querySelector(".mobile-close");
        function openMenu() {
          mobileMenu.classList.add("open");
          hamburger.classList.add("active");
          hamburger.setAttribute("aria-expanded", "true");
          mobileMenu.setAttribute("aria-hidden", "false");
          body.classList.add("no-scroll");
          // Focus first link for accessibility
          const firstLink = mobileMenu.querySelector("a");
          if (firstLink) firstLink.focus();
        }

        function closeMenu() {
          mobileMenu.classList.remove("open");
          hamburger.classList.remove("active");
          hamburger.setAttribute("aria-expanded", "false");
          mobileMenu.setAttribute("aria-hidden", "true");
          body.classList.remove("no-scroll");
          hamburger.focus();
        }

        function toggleMenu() {
          if (mobileMenu.classList.contains("open")) {
            closeMenu();
          } else {
            openMenu();
          }
        }

        hamburger.addEventListener("click", toggleMenu);

        // Close button inside the mobile panel
        if (closeBtn) {
          closeBtn.addEventListener("click", closeMenu);
        }

        // Close when a mobile nav link is clicked
        mobileLinks.forEach((a) =>
          a.addEventListener("click", () => {
            closeMenu();
          })
        );

        // Close on Escape key
        window.addEventListener("keydown", (e) => {
          if (e.key === "Escape" && mobileMenu.classList.contains("open")) {
            closeMenu();
          }
        });

        // Close the menu if transitioning to desktop
        window.addEventListener("resize", () => {
          if (
            window.innerWidth >= 769 &&
            mobileMenu.classList.contains("open")
          ) {
            closeMenu();
          }
        });
      }
    })();
  </script>
  <!-- Inline script: Mutant Standard emoji replacement (vanilla) -->
  <script>
    (function () {
      const BASE = "https://cdn.jsdelivr.net/gh/Mstrodl/mutant-standard-mirror@master/emoji/";
      const SKIP_TAGS = new Set(["SCRIPT", "STYLE", "TEXTAREA", "CODE", "PRE", "NOSCRIPT", "SVG", "MATH"]);
      let emojiLike;
      try {
        emojiLike = new RegExp('[\\p{Extended_Pictographic}\\u200D\\uFE0F]', 'u');
      } catch (e) {
        // Fallback range for emoji blocks + ZWJ/VS16
        emojiLike = /[\u200D\uFE0F\u{1F1E6}-\u{1F6FF}\u{1F700}-\u{1FAFF}]/u;
      }

      function toCodeSeq(grapheme) {
        const codes = [];
        for (let i = 0; i < grapheme.length; ) {
          const cp = grapheme.codePointAt(i);
          codes.push(cp.toString(16).toLowerCase());
          i += cp > 0xffff ? 2 : 1;
        }
        return codes.join("-");
      }

      function createEmojiImg(gr) {
        const img = document.createElement("img");
        img.className = "emoji";
        img.loading = "lazy";
        img.decoding = "async";
        img.setAttribute("role", "img");
        img.setAttribute("aria-label", gr);
        img.alt = ""; // avoid double-reading
        img.src = BASE + toCodeSeq(gr) + ".svg";
        return img;
      }

      function segment(text) {
        if (window.Intl && Intl.Segmenter) {
          const seg = new Intl.Segmenter(undefined, { granularity: "grapheme" });
          return Array.from(seg.segment(text), (s) => s.segment);
        }
        // Fallback: naive split by code point
        const arr = [];
        for (const ch of text) arr.push(ch);
        return arr;
      }

      function processTextNode(node) {
        const s = node.nodeValue;
        if (!s || !emojiLike.test(s)) return;
        const parts = segment(s);
        const frag = document.createDocumentFragment();
        for (const part of parts) {
          if (emojiLike.test(part)) {
            frag.appendChild(createEmojiImg(part));
          } else {
            frag.appendChild(document.createTextNode(part));
          }
        }
        node.parentNode && node.parentNode.replaceChild(frag, node);
      }

      function walk(node) {
        if (!node || SKIP_TAGS.has(node.nodeName)) return;
        // Skip already replaced emoji images
        if (node.nodeType === Node.ELEMENT_NODE && node.classList && node.classList.contains("emoji")) return;
        if (node.nodeType === Node.TEXT_NODE) {
          processTextNode(node);
          return;
        }
        let child = node.firstChild;
        while (child) {
          const next = child.nextSibling;
          walk(child);
          child = next;
        }
      }

      function processRoot(root) {
        walk(root || document.body);
      }

      function observe() {
        const mo = new MutationObserver((mutations) => {
          for (const m of mutations) {
            m.addedNodes && m.addedNodes.forEach((n) => {
              if (n.nodeType === Node.TEXT_NODE) {
                processTextNode(n);
              } else if (n.nodeType === Node.ELEMENT_NODE) {
                processRoot(n);
              }
            });
          }
        });
        mo.observe(document.documentElement, { childList: true, subtree: true });
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", () => {
          processRoot(document.body);
          observe();
        });
      } else {
        processRoot(document.body);
        observe();
      }
    })();
  </script>
</header>
