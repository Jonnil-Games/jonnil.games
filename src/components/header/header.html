<header>
  <nav class="navbar" aria-label="Primary">
    <div class="logo">
      <a href="/" aria-label="Jonnil Games Home">
        <span class="logo-text">Jonnil Games</span>
      </a>
    </div>

    <!-- Desktop Navigation Links -->
    <ul class="nav-links">
      <li><a href="/">Home</a></li>
      <li><a href="/games.html">Games</a></li>
      <li><a href="/blog/index.html">Blog</a></li>
      <li><a href="/team.html">Team</a></li>
      <li><a href="/about.html">About</a></li>
    </ul>

    <!-- Hamburger Button for Mobile -->
    <button
      class="hamburger"
      type="button"
      aria-label="Open navigation menu"
      aria-expanded="false"
      aria-controls="mobile-menu"
    >
      <span class="hamburger-bar"></span>
      <span class="hamburger-bar"></span>
      <span class="hamburger-bar"></span>
    </button>
  </nav>

  <!-- Mobile Menu -->
  <nav
    id="mobile-menu"
    class="mobile-menu"
    aria-hidden="true"
    aria-label="Mobile"
  >
    <ul class="mobile-nav-links">
      <li><a href="/">Home</a></li>
      <li><a href="/games.html">Games</a></li>
      <li><a href="/blog/index.html">Blog</a></li>
      <li><a href="/team.html">Team</a></li>
      <li><a href="/about.html">About</a></li>
    </ul>

    <div class="mobile-social-links">
      <a
        href="https://bsky.app/profile/jonnil.games"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Follow us on BlueSky"
        class="social-icon"
      >
        <i class="ri-bluesky-fill" aria-hidden="true"></i>
      </a>

      <a
        href="https://fedi.jonnil.games/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Follow us on Mastodon"
        class="social-icon"
      >
        <!-- Mastodon icon -->
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="currentColor"
          aria-hidden="true"
        >
          <path
            d="M23.268 5.313c-.35-2.578-2.617-4.61-5.304-5.004C17.51.242 15.792 0 11.813 0h-.03c-3.98 0-4.835.242-5.288.309C3.882.692 1.496 2.518.917 5.127..."
          />

      <a
        href="https://discord.gg/GAmTXwqH9V"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Join our Discord"
        class="social-icon"
      >
        <!-- Discord icon -->
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="currentColor"

    <div class="mobile-footer-info">

      <p>With 💖 from Sweden!</p>
      <p>
        Email: <a href="mailto:contact@jonnil.games">contact@jonnil.games</a>
      </p>
    </div>
  </nav>

  <!-- Inline, framework-free, accessible mobile menu controller -->
  <script>
    (function () {
      const root = document.currentScript.closest("header");
      if (!root) return;
      const hamburger = root.querySelector(".hamburger");
      const mobileMenu = root.querySelector("#mobile-menu");
      const body = document.body;
      if (!hamburger || !mobileMenu) return;

      function setOpenState(open) {
        mobileMenu.classList.toggle("open", open);
        hamburger.classList.toggle("active", open);
        hamburger.setAttribute("aria-expanded", String(open));
        mobileMenu.setAttribute("aria-hidden", String(!open));
        body.classList.toggle("no-scroll", open);
      }

      function toggle(open) {
        const next =
          typeof open === "boolean"
            ? open
            : !mobileMenu.classList.contains("open");
        setOpenState(next);
        if (next) {
          const first = mobileMenu.querySelector(
            'a, button, [tabindex]:not([tabindex="-1"])'
          );
          if (first) first.focus({ preventScroll: true });
        } else {
          hamburger.focus({ preventScroll: true });
        }
      }

      // Toggle on click
      hamburger.addEventListener("click", () => toggle());

      // Close on link click inside menu
      mobileMenu.addEventListener("click", (e) => {
        const link = e.target.closest("a");
        if (link) toggle(false);
      });

      // Close when clicking outside
      document.addEventListener("click", (e) => {
        if (!mobileMenu.classList.contains("open")) return;
        if (root.contains(e.target)) return; // clicks inside header allowed
        toggle(false);
      });

      // Close on Escape
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && mobileMenu.classList.contains("open"))
          toggle(false);
      });

      // Close if resized to desktop
      window.addEventListener("resize", () => {
        if (window.innerWidth >= 769 && mobileMenu.classList.contains("open"))
          toggle(false);
      });

      // Active link highlight (desktop + mobile)
      const currentPath = window.location.pathname;
      function shouldBeActive(linkPath) {
        if (
          linkPath === "/" &&
          (currentPath === "/" || currentPath === "/index.html")
        )
          return true;
        if (linkPath.endsWith("index.html")) {
          const base = linkPath.slice(0, -"index.html".length);
          return (
            currentPath === linkPath ||
            currentPath === base ||
            currentPath.startsWith(base)
          );
        }
        return (
          currentPath === linkPath ||
          (currentPath.endsWith(".html") &&
            currentPath.replace(".html", "") === linkPath)
        );
      }
      const allLinks = root.querySelectorAll(
        ".nav-links a, .mobile-nav-links a"
      );
      allLinks.forEach((a) =>
        a.classList.toggle(
          "active",
          shouldBeActive(a.getAttribute("href") || "")
        )
      );
    })();
  </script>
</header>
